server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 目录补斜杠的 301 必须是相对 Location。本 pod 在 chengsi 外网 nginx 之后
    # （proxy_pass http://127.0.0.1:30442），nginx 只看得见 http，绝对跳转会把
    # 外部的 https 降级成 http://www.finddatatech.cloud/crm/（2026-11-19 实测）。
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Astro static build: real files only. Unknown paths serve the branded
    # 404 page (dist/404.html, built from src/pages/404.astro).
    error_page 404 /404.html;
    location / {
        try_files $uri $uri/ =404;
    }

    # Immutable hashed assets
    location /_astro/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
