# LibreChat (slim — no RAG/vectordb/rag_api) on k3s via raw manifests.
# LibreChat has no official Helm chart; its native form is docker-compose, so
# we run the official image directly as Deployments + Services + PVCs + one
# ConfigMap holding librechat.yaml.
#
# Secrets created out-of-band (no values in git). Run once on the box:
#   S=$(openssl rand -hex 32); R=$(openssl rand -hex 32); C=$(openssl rand -hex 16); M=$(openssl rand -hex 16)
#   sudo k3s kubectl -n librechat create secret generic librechat-env \
#     --from-literal=CREDS_KEY="$C" \
#     --from-literal=JWT_SECRET="$S" \
#     --from-literal=JWT_REFRESH_SECRET="$R" \
#     --from-literal=MEILI_MASTER_KEY="$M" \
#     --from-literal=NEWAPI_KEY="$NEWAPI_KEY"   # real key stays out of git; paste it on the box
#     --from-literal=MCP_TOKEN="$(grep -E '^MCP_TOKEN=' /opt/fd/finddata/fd-open-data-mcp/.env | cut -d= -f2-)"
# ponytail: JWT_REFRESH_SECRET is NOT optional in recent LibreChat — generateRefreshToken()
# throws "secretOrPrivateKey must have a value" at login without it, surfacing as a generic
# "internal server error" even though the password check passed.
---
apiVersion: v1
kind: Namespace
metadata:
  name: librechat
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: librechat-config
  namespace: librechat
data:
  librechat.yaml: |
    version: 1.3.13
    cache: true
    endpoints:
      custom:
        # ponytail: despite the historical "LiteLLM" label, this endpoint has
        # always been NewAPI (Kong :30080 -> newapi) — renamed to "NewAPI" to
        # stop people blaming the LiteLLM proxy on America for its errors.
        - name: "NewAPI"
          apiKey: "${NEWAPI_KEY}"
          baseURL: "http://124.223.42.3:30080/v1"
          models:
            default:
              - deepseek-v4-flash
              - deepseek-v4-pro
              - glm-5.2
              - kimi-k3
              - minimax-m3
              # ponytail: real NewAPI model id is "qwen3.7-plus" (no hyphen
              # after qwen) — "qwen-3.7-plus" 503s with model_not_found.
              - qwen3.7-plus
            fetch: true
          titleConvo: false
          modelDisplayLabel: "NewAPI"
    mcpServers:
      fd-open-data-mcp:
        type: streamable-http
        url: "http://fd-open-data-mcp.mcp.svc.cluster.local:8899/mcp"
        headers:
          Authorization: "Bearer ${MCP_TOKEN}"
        timeout: 30000
      # fd-cn-report runs in a SEPARATE k3s cluster (zihan, tailscale
      # 100.64.0.4), reached cross-cluster via its NodePort 30802. Same
      # MCP_TOKEN secret — zihan's MCP_BEARER_TOKEN is byte-identical.
      fd-cn-report:
        type: streamable-http
        url: "http://100.64.0.4:30802/mcp"
        headers:
          Authorization: "Bearer ${MCP_TOKEN}"
        timeout: 30000
      # fd-daas-mcp also runs on zihan (fd-mcp ns, NodePort 30804).
      # Same MCP_TOKEN family as fd-cn-report.
      fd-daas-mcp:
        type: streamable-http
        url: "http://100.64.0.4:30804/mcp"
        headers:
          Authorization: "Bearer ${MCP_TOKEN}"
        timeout: 30000
      # fd-find-data-business-mcp (zihan :30803) is NOT wired in: it enforces
      # per-user ES384 JWTs from auth.finddatatech.cloud — a static bearer
      # 401s. Re-wire only after a service JWT is minted (MCP_BUSINESS_TOKEN).
    mcpSettings:
      # ponytail: *.svc.cluster.local is an in-cluster "local domain" — LibreChat's
      # SSRF guard blocks it. allowedAddresses (host:port SSRF exemption) did NOT
      # match a cluster-DNS hostname, so use allowedDomains (strict whitelist) with
      # the exact proto+host+port string the guard quotes in its error. Bare
      # domain is listed too as a fallback. Widen as more in-cluster MCP servers appear.
      allowedDomains:
        - "http://fd-open-data-mcp.mcp.svc.cluster.local:8899"
        - "fd-open-data-mcp.mcp.svc.cluster.local"
        # fd-cn-report: cross-cluster via zihan's tailscale IP (100.64.0.4:30802).
        # ponytail: raw CGNAT IP — if LibreChat's SSRF guard blocks it as private,
        # the log quotes the exact string to whitelist; widen here then re-rollout.
        - "http://100.64.0.4:30802"
        - "http://100.64.0.4:30804"
        - "100.64.0.4"
---
apiVersion: v1
kind: Service
metadata:
  name: librechat-mongo
  namespace: librechat
spec:
  selector:
    app: librechat-mongo
  ports:
    - port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: librechat-mongo
  namespace: librechat
  labels:
    app: librechat-mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: librechat-mongo
  template:
    metadata:
      labels:
        app: librechat-mongo
    spec:
      containers:
        - name: mongo
          # ponytail: harbor.fd/cache/* is dead (its SSH-tunnel registry mirror
          # to cheap-2 never came back); docker.io works via the k3s mirror list.
          image: docker.io/library/mongo:7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "128Mi"
              cpu: "100m"
      # ponytail: pin to the control-plane node — local-path PVC data (accounts,
      # conversations) was created here and local-path volumes are node-bound.
      nodeSelector:
        kubernetes.io/hostname: vm-0-9-ubuntu
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: librechat-mongo-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: librechat-mongo-data
  namespace: librechat
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: librechat-meili
  namespace: librechat
spec:
  selector:
    app: librechat-meili
  ports:
    - port: 7700
      targetPort: 7700
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: librechat-meili
  namespace: librechat
  labels:
    app: librechat-meili
spec:
  replicas: 1
  selector:
    matchLabels:
      app: librechat-meili
  template:
    metadata:
      labels:
        app: librechat-meili
    spec:
      containers:
        - name: meilisearch
          image: docker.io/getmeili/meilisearch:v1.6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7700
          env:
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: librechat-env
                  key: MEILI_MASTER_KEY
          volumeMounts:
            - name: data
              mountPath: /meili_data
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "128Mi"
              cpu: "100m"
      nodeSelector:
        kubernetes.io/hostname: vm-0-9-ubuntu
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: librechat-meili-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: librechat-meili-data
  namespace: librechat
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: librechat-api
  namespace: librechat
spec:
  type: NodePort
  selector:
    app: librechat-api
  ports:
    - name: http
      port: 3080
      targetPort: 3080
      nodePort: 30830
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: librechat-api
  namespace: librechat
  labels:
    app: librechat-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: librechat-api
  template:
    metadata:
      labels:
        app: librechat-api
    spec:
      # Harbor "cache" project rejects anonymous pulls (401) — this secret
      # (same admin credential as registries.yaml) is required, or the pod
      # sits in ImagePullBackOff. Created out-of-band in the librechat ns.
      imagePullSecrets:
        - name: harbor-pull
      containers:
        - name: api
          # Re-homed 2026-08-30: pushed ghcr.io/danny-avila/librechat to the
          # America Harbor (project "cache", public) after harbor.fd died.
          image: 23.144.68.246:30880/cache/librechat:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3080
          envFrom:
            - secretRef:
                name: librechat-env
          env:
            - name: MONGO_URI
              value: "mongodb://librechat-mongo:27017/LibreChat"
            - name: MEILI_SERVER
              value: "http://librechat-meili:7700"
            - name: ENDPOINTS
              value: "custom"
            # ponytail: registration is OFF by default in recent LibreChat, which
            # hides the Sign up link and leaves a fresh DB with no loginable account.
            # Flip to "false" after the first admin registers so the public :30830
            # can't be used to burn LiteLLM credits via open signup.
            - name: ALLOW_REGISTRATION
              value: "true"
          volumeMounts:
            - name: config
              mountPath: /app/librechat.yaml
              subPath: librechat.yaml
          resources:
            limits:
              memory: "1Gi"
              cpu: "1000m"
            requests:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: config
          configMap:
            name: librechat-config
      # ponytail: keep next to mongo/meili on vm-0-9 (image cache + MCP svc DNS).
      nodeSelector:
        kubernetes.io/hostname: vm-0-9-ubuntu
