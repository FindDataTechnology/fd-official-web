# fd-open-data-mcp on k3s (single-node, 124.220.7.175).
#
# The Secret is created out-of-band from the on-box .env so no sensitive
# values live in git. Run once on the box:
#   sudo k3s kubectl -n mcp create secret generic fd-mcp-env \
#     --from-env-file=/opt/fd/finddata/fd-open-data-mcp/.env
#
# The whole /opt/fd/finddata tree is hostPath-mounted RW so the container has
# exact filesystem parity with the systemd unit: the live daas.db (which the
# server commits to via update_entity/concepts/bindings) + FINDDATA_ROOT
# provider data both resolve identically. No re-seed.
---
apiVersion: v1
kind: Namespace
metadata:
  name: mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fd-open-data-mcp
  namespace: mcp
  labels:
    app: fd-open-data-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fd-open-data-mcp
  template:
    metadata:
      labels:
        app: fd-open-data-mcp
    spec:
      nodeSelector:
        kubernetes.io/hostname: vm-0-9-ubuntu
      containers:
        - name: fd-open-data-mcp
          image: harbor.fd/finddata/fd-open-data-mcp:torch
          # ponytail: harbor.fd resolves via k3s registries.yaml to the Harbor
          # registry on china-cheap-2, reached through the harbor-tunnel
          # systemd SSH tunnel (127.0.0.1:5000 on this box). IfNotPresent keeps
          # restarts cheap; Harbor keeps the image so docker.io's firewall no
          # longer matters. After pushing a NEW digest under :torch, run
          # `kubectl rollout restart` to re-resolve the tag.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8899
          env:
            # MiniLM is baked into the image; never phone home (hf-mirror is
            # unreachable from the pod and made ai_search hang on HEAD retries).
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
          envFrom:
            - secretRef:
                name: fd-mcp-env
          volumeMounts:
            - name: finddata
              mountPath: /opt/fd/finddata
          resources:
            limits:
              # Raised for the torch image: MiniLM CPU inference needs headroom.
              # ~1.2Gi is observed headroom; revisit if the node OOMs alongside
              # the LibreChat stack.
              memory: "2Gi"
              cpu: "1000m"
            requests:
              memory: "512Mi"
              cpu: "200m"
          # ponytail: no liveness/readiness probes yet — add if CrashLoops.
      volumes:
        - name: finddata
          hostPath:
            path: /opt/fd/finddata
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: fd-open-data-mcp
  namespace: mcp
spec:
  type: NodePort
  selector:
    app: fd-open-data-mcp
  ports:
    - name: http
      port: 8899
      targetPort: 8899
      nodePort: 30899
      protocol: TCP
