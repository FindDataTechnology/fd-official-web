# fd-open-data-mcp on k3s (single-node, 124.220.7.175).
#
# The Secret is created out-of-band from the on-box .env so no sensitive
# values live in git. Run once on the box:
#   sudo k3s kubectl -n mcp create secret generic fd-mcp-env \
#     --from-env-file=/opt/fd/finddata/fd-open-data-mcp/.env
#
# The whole /opt/fd/finddata tree is hostPath-mounted RW so the container has
# exact filesystem parity with the systemd unit: the live daas.db (which the
# server commits to via update_entity/concepts/bindings) + FINDDATA_ROOT
# provider data both resolve identically. No re-seed.
---
apiVersion: v1
kind: Namespace
metadata:
  name: mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fd-open-data-mcp
  namespace: mcp
  labels:
    app: fd-open-data-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fd-open-data-mcp
  template:
    metadata:
      labels:
        app: fd-open-data-mcp
    spec:
      nodeSelector:
        kubernetes.io/hostname: vm-0-9-ubuntu
      # tcr-pull: ccr.ccs.tencentyun.com (TCR personal edition) — primary
      # image channel per openspec tcr-image-pipeline. harbor-auth kept so a
      # Jenkins/Harbor fallback tag still rolls without manifest surgery.
      imagePullSecrets:
        - name: harbor-auth
        - name: tcr-pull
      # Schema migration stage: alembic upgrade head must complete BEFORE the
      # server starts (initContainers gate the main container). Serialized by
      # a session-level Postgres advisory lock
      # pg_advisory_lock(hashtext('fd_mcp_schema_migrate')) held for the whole
      # run, so concurrent pod starts queue instead of racing; already-at-head
      # is a no-op success (idempotent). A non-zero exit fails the pod: the new
      # version never serves and the previous one keeps serving.
      initContainers:
        - name: migrate-schema
          # 2026-11-13 converge-line-identity-and-keys：镜像内需含 /app/line-manifest.json
          # （/.well-known 自描述端点；Dockerfile.torch 单阶段片 /app 里没有它 → 404）。回滚=sha-c086bad。
          image: ccr.ccs.tencentyun.com/finddata/fd-open-data-mcp:sha-4e45bb3  # 与主容器同片；无新增迁移（库头 0021，未带 0022/0023） + /.well-known 自描述端点（change 1.4，公开免鉴权）（同片说明见 fd-infra-deploy：基座取 0022 之前，库头仍 0021）
          imagePullPolicy: IfNotPresent
          # Same database-URL source as the server container:
          # FD_OPEN_DATA_MCP_DATABASE_URL arrives via the fd-mcp-env Secret.
          envFrom:
            - secretRef:
                name: fd-mcp-env
          # The sqlite URL points inside the hostPath tree - the stage needs
          # the same mount as the server to reach (and bootstrap) the db.
          volumeMounts:
            - name: finddata
              mountPath: /opt/fd/finddata
          command: ["python", "-m", "fd_open_data_mcp.db.migrate_stage"]
      containers:
        - name: fd-open-data-mcp
          # Immutable sha tag (commit bdad1e4, openspec image-slimming: the
          # fastembed/onnxruntime image — same MiniLM weights and vectors, no
          # torch stack; equivalence gated by
          # reports/onnx-equivalence.md). Built by GitHub Actions -> hkccr,
          # cheap-3 tcr-relay -> ccr. New releases = new sha tags, so
          # IfNotPresent always pulls the referenced digest.
          #
          # sha-4c23a85 = establish-data-retention-principle 第 1-3 期：留存契约表
          # + 写入闸门（FD_RETENTION_GATE，默认 off，不改变现有行为）+ 写路径执行
          # T 类语义（"只留当期"从此真的只留一条，旧快照并成一条 batch 修订，
          # 止住 yield/nav/performance 每实体每天一行的复发）。内容硬门已验：
          # cache.py 含 _snapshot_consolidate、alembic/versions/0020_retention_contracts.py、
          # fetch/retention.py。库头已是 0020，无需先手工改版本表。
          # sha-70534ea 追加：W 类在写入入口裁掉窗口外的点（重抓不再写回老行）。
          # sha-5c9b79b 追加：补数入口(new-only)也执行留存语义——此前它是绕过 T 的后门。
          # sha-47b8d74 追加：单点写入口 write_cache 补上契约闸 + W 窗口裁剪（此前只有
          # T 合并，`fetch(点)` 可写进无契约的源、可把 W 类窗口外的老点写回来）；新增
          # fetch/retention_bulk.py，五支直写观测的脚本（bulk_ingest_* / financial_consumer）
          # 在同一事务里执行同一套收尾；并加反旁路静态闸，防止第六支脚本再漏。
          # 回滚=sha-5c9b79b（再往前 sha-70534ea / sha-4c23a85 / sha-647f837；无新增迁移要回退）。
          # sha-a4b4493 追加：豁免机制（exempt_reason / exempt_owner / exempt_until +
          # alembic 0021）——规范要求「窗口之外的保留必须有用途+到期+责任人」，此前没有落点。
          # 本片**带新迁移**：initContainer 会把库头 0020 → 0021（幂等）。回滚镜像不必退
          # 版本号：0021 只加三个可空列，旧代码不读它们。
          # 回滚=sha-47b8d74。
          # sha-34d55b6 追加：闸门档位**透传**给集群 Job（此前该 env 只在服务端清单里，
          # 爬虫侧永远 off——同一条规则两处两套行为）；契约缺口清零（106 族 0 缺口）。
          # 档位仍是 warn：enforce 意味着「新族没契约就拒写」，医药域在活跃建新族，
          # 切了会让它们的写入静默失败（decisions §5.34）。回滚=sha-a4b4493。
          # 2026-11-13 converge-line-identity-and-keys：镜像内需含 /app/line-manifest.json
          # （/.well-known 自描述端点；Dockerfile.torch 单阶段片 /app 里没有它 → 404）。回滚=sha-c086bad。
          image: ccr.ccs.tencentyun.com/finddata/fd-open-data-mcp:sha-4e45bb3  # + /.well-known 自描述端点（change 1.4，公开免鉴权）（同片说明见 fd-infra-deploy：基座取 0022 之前，库头仍 0021）
          imagePullPolicy: IfNotPresent
          # ENTRYPOINT in the image serves :8300 since commit 5455d38; this
          # deployment's Service/NodePort are pinned to 8899 (gateway upstream
          # contract), so pin the listen port explicitly.
          command: ["fd-open-data-mcp", "serve", "--transport", "http", "--host", "0.0.0.0", "--port", "8899"]
          ports:
            - containerPort: 8899
          env:
            # MiniLM is baked into the image; never phone home (hf-mirror is
            # unreachable from the pod and made ai_search hang on HEAD retries).
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            # mcp-search-engine-overhaul: semantic similarity executes inside
            # PostgreSQL via the HNSW-indexed embedding_vec columns (alembic
            # 0003). json = legacy full-scan rollback path; matrix = in-process
            # numpy cache. ef beam: FD_MCP_HNSW_EF_SEARCH (default 200).
            - name: FD_MCP_VECTOR_BACKEND
              value: "pgvector"
            # registry-transparent-read-and-scope: transparent reads for
            # registry-only indicators route over MCP HTTP to the business-mcp
            # federation (zihan mesh). Flag staging: yearbook first (migration
            # plan) — widen to "1" after the live yearbook verification.
            - name: FD_MCP_BUSINESS_URL
              value: "http://100.64.0.4:30803/mcp"
            - name: FD_MCP_FEDERATED_READ
              value: "1"
            # 留存闸门第 2 档：查契约、缺了只报警、**仍允许写入**。
            # 开关顺序是 off → warn（观察）→ enforce，不能直接跳 enforce：
            # 缺契约即拒写会让对应源的爬取当晚全线停摆。2026-11-11 实测
            # 112 个有数据的族在库里全部有契约（含 source 级 `*` 通配），
            # 所以这一档应当是安静的；若日志出现"留存契约缺失"再加契约。
            - name: FD_RETENTION_GATE
              value: "warn"
          envFrom:
            - secretRef:
                name: fd-mcp-env
          volumeMounts:
            - name: finddata
              mountPath: /opt/fd/finddata
          resources:
            limits:
              # Raised for the torch image: MiniLM CPU inference needs headroom.
              # ~1.2Gi is observed headroom; revisit if the node OOMs alongside
              # the LibreChat stack.
              memory: "2Gi"
              cpu: "1000m"
            requests:
              memory: "512Mi"
              cpu: "200m"
          # ponytail: no liveness/readiness probes yet — add if CrashLoops.
      volumes:
        - name: finddata
          hostPath:
            path: /opt/fd/finddata
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: fd-open-data-mcp
  namespace: mcp
spec:
  type: NodePort
  selector:
    app: fd-open-data-mcp
  ports:
    - name: http
      port: 8899
      targetPort: 8899
      nodePort: 30899
      protocol: TCP
