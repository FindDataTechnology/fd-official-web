# fd-official-web in-cluster serving stack.
# Managed by ArgoCD (Application: deploy/argocd/app-fd-web.yaml, path deploy/k8s).
# Image builds: CI is disabled (domestic-only policy, 2026-09-10) — build on the
# fd-deploy box (docker build with a pre-built dist/), push to Harbor, bump this
# tag by hand. If Harbor push auth is unavailable, importing the image into the
# node's containerd (k3s ctr -n k8s.io images import) also works: the pod pins
# the chengsi node and IfNotPresent uses the local image.
#
# Pinned to the chengsi node: host nginx proxies location / to this NodePort and
# cross-node pod networking is unavailable in this NAT-jailed cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: fd-web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: official-web
  namespace: fd-web
  labels:
    app: official-web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: official-web
  template:
    metadata:
      labels:
        app: official-web
    spec:
      imagePullSecrets:
        - name: harbor-pull
      nodeSelector:
        kubernetes.io/hostname: vm-0-9-ubuntu
      containers:
        - name: web
          image: harbor.finddatatech.cloud:8080/fd-web/official-web:0004dcb-202609180059
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: official-web
  namespace: fd-web
spec:
  type: NodePort
  selector:
    app: official-web
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30442
