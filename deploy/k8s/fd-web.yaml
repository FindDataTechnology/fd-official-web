# fd-official-web in-cluster stack — **NOT in the www request path**（2026-10-16 起）。
#
# 谁在服务 www.finddatatech.cloud：宿主机 nginx `location /` 直出静态目录
# `/opt/fd/web/dist`（见 124.220.7.175:/etc/nginx/sites-enabled/www.finddatatech.cloud）。
# 该目录由 cheap1 的 `/opt/fd/fd-web-deploy.sh` 发布：同步 gitee/main → docker 内 `npm run build`
# → rsync 到本目录（旧目录留 `dist.prev` 供回滚）。EdgeOne CDN 在更前面，`max-age=300`。
#
# 因此：**改这里的 image tag 不会改变线上页面**。2026-11-13 实历——把 tag 从 sha-85fdd08
# bump 到 sha-78dd486，Argo 同步、两个 Pod 都换片、pod 内 `/usr/share/nginx/html/zh/products/lex/`
# 确实含新改动，而公网仍是旧的（13635 字节 vs 产物 14493 字节，`eo-cache-status: MISS`
# 回源也是旧的），因为源站根本不回这两个 Pod。同一天先前那句「Host nginx proxies location /
# to this NodePort」就是这条假绿的源头，已删。
#
# 本 Deployment 保留为**服务路径备选**，不是内容回滚目标。两条理由都必须看：
#   ① 它的镜像停在 `sha-78dd486`，而内容已前进到 `e647bf2`（删掉哲思卡上那句「可私有化
#      部署」）。**按它回滚会把那个过度承诺重新发布一遍**——回滚内容请用 fd-deploy 上的
#      `dist.prev`（每次部署自动保留上一版），或重跑一个更早的 gitee 提交。
#   ② 镜像内构建拿不到 cheap1 那条线的 `GITHUB_TOKEN` / `STRAPI_*` / MCP token，抓取面
#      与在役产物本就不同，内容不可假定等价。
# 要让 Pod 线重新接管，必须同时改 nginx `location /` 回 `proxy_pass` 到 30442，否则只是空转；
# 接管后还得先按上面的差异重出一版镜像。发布官网请走 cheap1 那条线，不是这里。
apiVersion: v1
kind: Namespace
metadata:
  name: fd-web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: official-web
  namespace: fd-web
  labels:
    app: official-web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: official-web
  template:
    metadata:
      labels:
        app: official-web
    spec:
      imagePullSecrets:
        - name: harbor-pull
      nodeSelector:
        kubernetes.io/hostname: vm-0-9-ubuntu
      containers:
        - name: web
          # 2026-10-01: switched to the TCR standard channel (five-lines-public-surface
          # era; Harbor storage backend returning 500 on all manifests — socat→RustFS
          # tunnel down — after the node pruned the cached image post-eviction).
          # Node-level registries.yaml supplies TCR auth on vm-0-9 (chengsi).
          image: ccr.ccs.tencentyun.com/fd-web/official-web:sha-78dd486 # 识律五成员卡加成熟度标注（可售/内测中/孵化中），与产品条线真源 docs/product-lineup.json 同词表；源真 fd-official-web 78dd486；hkccr 与 ccr 双端 raw manifest sha256 一致（51d1ed31…，created 2026-11-13T14:02Z）后才 bump，上一版 sha-85fdd08，回滚=改回 sha-85fdd08
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: official-web
  namespace: fd-web
spec:
  type: NodePort
  selector:
    app: official-web
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30442
