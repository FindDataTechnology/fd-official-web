# fd-official-web in-cluster serving stack.
# Managed by ArgoCD (Application: deploy/argocd/app-fd-web.yaml, path deploy/k8s,
# source = gitee main). Image builds: Jenkins job `fd-official-web` (multi-stage
# Dockerfile builds the Astro site in-image and pushes to Harbor); bump this tag
# to roll. Host nginx proxies location / to this NodePort.
#
# Pinned to the chengsi node: host nginx proxies location / to this NodePort and
# cross-node pod networking is unavailable in this NAT-jailed cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: fd-web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: official-web
  namespace: fd-web
  labels:
    app: official-web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: official-web
  template:
    metadata:
      labels:
        app: official-web
    spec:
      imagePullSecrets:
        - name: harbor-pull
      nodeSelector:
        kubernetes.io/hostname: vm-0-9-ubuntu
      containers:
        - name: web
          # 2026-10-01: switched to the TCR standard channel (five-lines-public-surface
          # era; Harbor storage backend returning 500 on all manifests — socat→RustFS
          # tunnel down — after the node pruned the cached image post-eviction).
          # Node-level registries.yaml supplies TCR auth on vm-0-9 (chengsi).
          image: ccr.ccs.tencentyun.com/fd-web/official-web:sha-78dd486 # 识律五成员卡加成熟度标注（可售/内测中/孵化中），与产品条线真源 docs/product-lineup.json 同词表；源真 fd-official-web 78dd486；hkccr 与 ccr 双端 raw manifest sha256 一致（51d1ed31…，created 2026-11-13T14:02Z）后才 bump，上一版 sha-85fdd08，回滚=改回 sha-85fdd08
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: official-web
  namespace: fd-web
spec:
  type: NodePort
  selector:
    app: official-web
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30442
