<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" font-family="system-ui,'PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1120" height="360" fill="#ffffff"/>
  <!-- 上排：壹座 + 萬星 -->
  <g>
    <rect x="180" y="30" width="220" height="100" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="290" y="62" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">壹座 Base</text>
    <text x="290" y="86" text-anchor="middle" font-size="13" fill="#374151">集群平台 · 宿主与旗舰</text>
    <text x="290" y="108" text-anchor="middle" font-size="13" fill="#9a3412">组建 · 管理 · 迭代 · 分享</text>

    <rect x="720" y="30" width="220" height="100" rx="12" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="830" y="62" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">萬星 Constellation</text>
    <text x="830" y="86" text-anchor="middle" font-size="13" fill="#374151">运行时 · 上线与计费</text>
    <text x="830" y="108" text-anchor="middle" font-size="13" fill="#9a3412">部署 · 驻留 · 机群观测</text>

    <line x1="400" y1="80" x2="718" y2="80" stroke="#6b7280" stroke-width="2" marker-end="url(#arr2)"/>
    <text x="560" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b7280">壹座建管 · 萬星上线运行</text>
  </g>
  <!-- 中间：跨线编排标签 -->
  <rect x="430" y="160" width="260" height="36" rx="18" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="560" y="183" text-anchor="middle" font-size="14" fill="#374151">集群按业务场景跨线编排</text>
  <line x1="290" y1="130" x2="450" y2="160" stroke="#d1d5db" stroke-width="1.6"/>
  <line x1="830" y1="130" x2="670" y2="160" stroke="#d1d5db" stroke-width="1.6"/>
  <!-- 下排：三条供给域 -->
  <g>
    <rect x="100" y="240" width="200" height="92" rx="12" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
    <text x="200" y="272" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">柏讯 Wire</text>
    <text x="200" y="294" text-anchor="middle" font-size="13" fill="#374151">数据供给域</text>
    <text x="200" y="314" text-anchor="middle" font-size="12" fill="#6b7280">从数据源到可用数据</text>

    <rect x="460" y="240" width="200" height="92" rx="12" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
    <text x="560" y="272" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">识律 Lex</text>
    <text x="560" y="294" text-anchor="middle" font-size="13" fill="#374151">文本供给域</text>
    <text x="560" y="314" text-anchor="middle" font-size="12" fill="#6b7280">法律 · 论文 · 思想 · 剧本</text>

    <rect x="820" y="240" width="200" height="92" rx="12" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
    <text x="920" y="272" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">谦面 Facet</text>
    <text x="920" y="294" text-anchor="middle" font-size="13" fill="#374151">技能与发布域</text>
    <text x="920" y="314" text-anchor="middle" font-size="12" fill="#6b7280">打通主流市场与 harness</text>
  </g>
  <line x1="200" y1="240" x2="500" y2="196" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr2)"/>
  <line x1="560" y1="240" x2="560" y2="200" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr2)"/>
  <line x1="920" y1="240" x2="620" y2="196" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr2)"/>
</svg>
