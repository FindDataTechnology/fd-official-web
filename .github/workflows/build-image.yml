# DISABLED (2026-09-10): site image builds are DOMESTIC-ONLY.
#
# Policy: GitHub-hosted runners must NEVER push to the domestic Harbor
# (harbor.finddatatech.cloud) or any CN server — foreign runner IPs hammering
# domestic endpoints risk IP bans. The site deploys via:
#   - static fallback: bash deploy.sh (rsync dist to the box, nginx serves it)
#   - pod path:        docker build on the fd-deploy box + push to the
#                      domestic Harbor + kubectl apply deploy/k8s/fd-web.yaml
# (see ops-notes in the finddata workspace openspec changes).
name: build-image (disabled)
on: workflow_dispatch
jobs:
  refuse:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse
        run: |
          echo "::error::Image builds are domestic-only (box). Do not re-enable pushes from GitHub runners."
          exit 1
